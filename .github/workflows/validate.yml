name: Validate learning app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check fallback-engine.js
          node --check tab-resilience.js
          node --check aqa-deep-dive.js
          node --check simulation-guide.js
          node --check accuracy-visuals.js
          node --check classroom-upgrades.js
          node --check spec-mastery.js
          node --check advanced-learning.js
          node --check diagnostic-teacher.js
          node --check rutherford-experiment.js
          node --check simulation-audio.js
          node --check particle-depth.js
          node --check simulation-smoke-test.mjs
          node --check simulation-presentation.js
          node --check learning-tools.js
          node --check learning-hub.js
          node --check simulation-essentials.js
          node --check simulation-change-coach.js
          node --check lesson-sequence.js
          node --check start-here.js
          node --check revision-hub.js
          node --check exam-skills.js

      - name: Check simulation registry and required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s fallback-engine.js
          test -s tab-resilience.js
          test -s aqa-deep-dive.js
          test -s simulation-guide.js
          test -s accuracy-visuals.js
          test -s classroom-upgrades.js
          test -s spec-mastery.js
          test -s advanced-learning.js
          test -s diagnostic-teacher.js
          test -s rutherford-experiment.js
          test -s rutherford-experiment.css
          test -s simulation-audio.js
          test -s simulation-screen.css
          test -s interactive-3d.css
          test -s vendor/three.module.min.js
          test -s vendor/three.core.min.js
          test -s particle-depth.js
          test -s particle-depth.css
          test -s simulation-smoke-test.mjs
          test -s simulation-presentation.js
          test -s simulation-presentation.css
          test -s learning-tools.js
          test -s learning-tools.css
          test -s learning-hub.js
          test -s learning-hub.css
          test -s simulation-essentials.js
          test -s simulation-essentials.css
          test -s student-ui-polish.css
          test -s simulation-change-coach.js
          test -s simulation-change-coach.css
          test -s lesson-sequence.js
          test -s lesson-sequence.css
          test -s start-here.js
          test -s start-here.css
          test -s revision-hub.js
          test -s revision-hub.css
          test -s exam-skills.js
          test -s exam-skills.css
          test -s knowledge-organiser.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app.js').read_text(encoding='utf-8')
          defs=re.search(r'const simDefs=\[(.*?)\];',s,re.S).group(1)
          ids=re.findall(r"\['([^']+)'",defs)
          builders=re.findall(r'builders\.([A-Za-z0-9_]+)=',s)
          missing=[x for x in ids if x not in builders]
          assert len(ids)==13, f'Expected 13 simulations, found {len(ids)}: {ids}'
          assert not missing, f'Missing builders: {missing}'
          assert "$$('.sim-tab').forEach" in s, 'Simulation switcher must update all tabs'
          print('Registry OK:', ', '.join(ids))
          PY

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Smoke test every simulation in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/particle-lab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          TEST_URL=http://127.0.0.1:4173/ node simulation-smoke-test.mjs
