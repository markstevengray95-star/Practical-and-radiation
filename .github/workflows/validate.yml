name: Validate learning app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Repair known syntax typos if present
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('x.material.dispose?.()}})}}}', 'x.material.dispose?.()}})}}', 1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')

          p = Path('fallback-engine.js')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("km:['s','ū']},charge:{u:", "km:['s','ū']},charge={u:", 1)
          s2 = s2.replace("'s̄':1/3},strange:{u:", "'s̄':1/3},strange={u:", 1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet; then
            echo "No repair needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
            git add app.js fallback-engine.js
            git commit -m "Fix simulation engine syntax validation errors"
            git push
          fi
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check fallback-engine.js
          node --check tab-resilience.js
          node --check aqa-deep-dive.js
          node --check simulation-guide.js
          node --check accuracy-visuals.js
          node --check classroom-upgrades.js
      - name: Check required app files
        run: test -s index.html && test -s styles.css && test -s app.js && test -s fallback-engine.js && test -s tab-resilience.js && test -s aqa-deep-dive.js && test -s simulation-guide.js && test -s accuracy-visuals.js && test -s classroom-upgrades.js
