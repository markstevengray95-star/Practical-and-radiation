name: Validate learning app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Repair known syntax typo if present
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('x.material.dispose?.()}})}}}', 'x.material.dispose?.()}})}}', 1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet; then
            echo "No repair needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js
            git commit -m "Fix app.js syntax validation error"
            git push
          fi
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required app files
        run: test -s index.html && test -s styles.css && test -s app.js
