name: Validate learning app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check fallback-engine.js
          node --check tab-resilience.js
          node --check aqa-deep-dive.js
          node --check simulation-guide.js
          node --check accuracy-visuals.js
          node --check classroom-upgrades.js
          node --check spec-mastery.js
          node --check advanced-learning.js
          node --check diagnostic-teacher.js
          node --check rutherford-experiment.js
          node --check simulation-audio.js
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s fallback-engine.js
          test -s tab-resilience.js
          test -s aqa-deep-dive.js
          test -s simulation-guide.js
          test -s accuracy-visuals.js
          test -s classroom-upgrades.js
          test -s spec-mastery.js
          test -s advanced-learning.js
          test -s diagnostic-teacher.js
          test -s rutherford-experiment.js
          test -s rutherford-experiment.css
          test -s simulation-audio.js
          test -s simulation-screen.css
          test -s interactive-3d.css
          test -s vendor/three.module.min.js
          test -s vendor/three.core.min.js
